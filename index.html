<html lang="en">

<title>My Cat</title>
<style>

</head>

add(new THREE.CylinderGeometry(.65,.75,.13,32),mat(0x4d3324,.65),[3.45,.65,-.85]);add(new THREE.CylinderGeometry(.1,.13,1.15,20),mat(0xa87f56,.5,.15),[3.45,1.2,-.85]);add(new THREE.CylinderGeometry(.46,.7,.65,32,1,true),new THREE.MeshStandardMaterial({color:0xe8caa6,roughness:.8,side:THREE.DoubleSide,emissive:0x7a4524,emissiveIntensity:.35}),[3.45,2,-.85]);

const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();let targetYaw=0,targetPitch=0,yaw=0,pitch=0,zoom=7.4,drag=false,px=0,py=0,react=0,wake=0,stretch=0,roll=0,joy=0,toyJiggle=0,toyPulse=0,lastClick=0,combo=0;

function reactNow(){const now=performance.now();combo=(now-lastClick<900)?combo+1:1;lastClick=now;react=1.15;wake=1;stretch=Math.min(1.35,.72+combo*.18);roll=Math.min(1.2,.45+combo*.22);joy=Math.min(1.5,.8+combo*.25);toyJiggle=Math.min(1.4,.65+combo*.18);toyPulse=1.2;synthMeow(combo%3);bubble.textContent=combo>=4?'Mrrrp! ❤':combo===3?'Meeeeow! ✨':combo===2?'Prrr-meow! 💗':'MEOOOW! ♡';bubble.classList.add('show');hint.classList.add('active');hint.textContent=combo>=3?'😻 So many pets!':'💛 Meow! Pet me again';setTimeout(()=>{bubble.classList.remove('show');hint.classList.remove('active')},850)}
renderer.domElement.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(drag){targetYaw+=(e.clientX-px)*.0035;targetPitch+=(e.clientY-py)*.0025;targetPitch=Math.max(-.28,Math.min(.28,targetPitch));px=e.clientX;py=e.clientY}renderer.domElement.style.cursor=catHit(e)?'pointer':'grab'});renderer.domElement.addEventListener('pointerup',e=>{drag=false;if(catHit(e))reactNow()});renderer.domElement.addEventListener('wheel',e=>{zoom+=e.deltaY*.003;zoom=Math.max(5.2,Math.min(9.4,zoom))},{passive:true});

const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();yaw+=(targetYaw-yaw)*.055;pitch+=(targetPitch-pitch)*.055;camera.position.x=Math.sin(yaw)*zoom;camera.position.z=Math.cos(yaw)*zoom;camera.position.y=2.55+pitch*5;camera.lookAt(0,1.1,.15);const breath=1+Math.sin(t*2.05)*.025,idle=Math.sin(t*1.3)*.015;react*=.91;wake*=.93;stretch*=.955;roll*=.95;joy*=.93;toyJiggle*=.92;toyPulse*=.9;body.scale.set((1.36+stretch*.07)*breath,(.73-stretch*.025)*breath,(.9+stretch*.045)*breath);belly.scale.set((1.25+stretch*.04)*breath,.5*breath,(.75+stretch*.03)*breath);cat.position.y=1.3+Math.sin(t*2.05)*.012+react*.02;cat.rotation.z=idle+Math.sin(t*16)*.03*react+Math.sin(t*8.5)*.06*roll;cat.rotation.x=-.03*stretch;head.rotation.z=.12+Math.sin(t*1.55)*.012+react*.08;head.rotation.x=stretch*.05;e1.rotation.z=-.18+Math.sin(t*4.3)*.018+react*.08;e2.rotation.z=.17-Math.sin(t*4.1)*.018-react*.08;tail.rotation.y=Math.sin(t*2.4)*.22+react*.22;tail.rotation.z=.12+Math.sin(t*3.2)*.08+roll*.12;const blink=Math.max(0,Math.sin(t*1.35+.7)*1.8-1.3),open=Math.min(1,wake*1.25+blink*.65);eyeLClosed.scale.y=Math.max(.08,1-open*.98);eyeRClosed.scale.y=Math.max(.08,1-open*.98);eyeLOpen.scale.set(1,.12+open*.95,.42+open*.45);eyeROpen.scale.set(1,.12+open*.95,.42+open*.45);shineL.scale.set(.1+open*.8,.1+open*.8,.1+open*.8);shineR.scale.set(.1+open*.8,.1+open*.8,.1+open*.8);shineL.material.opacity=.08+open*.65;shineR.material.opacity=.08+open*.65;zs.forEach((z,i)=>{z.position.y+=.0016*(i+1);z.material.opacity=.35+.4*(.5+.5*Math.sin(t*1.4+i));if(z.position.y>3.85)z.position.y=2.5+i*.28});hearts.forEach((h,i)=>{const v=Math.max(0,joy-i*.12);h.material.opacity=v*.85;h.position.y=2+i*.12+(1-v)*.25+Math.sin(t*2.5+i)*.03;h.position.x=-.1+i*.16+Math.sin(t*1.8+i)*.05;h.scale.setScalar(.16+v*.12+i*.015)});yarn.rotation.y+=.005+toyJiggle*.015;ball1.position.y=.24+Math.abs(Math.sin(t*6.5))*.02*toyJiggle;ball2.position.y=.19+Math.abs(Math.sin(t*7.5+1.2))*.018*to

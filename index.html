const hearts=[];for(let i=0;i<4;i++){const h=makeSprite('❤',-.2+i*.18,2.1+i*.06,.85-i*.08,.18+i*.025,'rgba(255,170,195,.95)');h.material.opacity=0;hearts.push(h)}

const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();let targetYaw=0,targetPitch=0,yaw=0,pitch=0,zoom=7.65,drag=false,px=0,py=0,react=0,wake=0,stretch=0,roll=0,joy=0,toyJiggle=0,toyPulse=0,lastClick=0,combo=0;
function synthMeow(type=0){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ac=synthMeow.ac||(synthMeow.ac=new AC());if(ac.state==='suspended')ac.resume();const now=ac.currentTime,osc=ac.createOscillator(),gain=ac.createGain(),filt=ac.createBiquadFilter();osc.type=type===2?'triangle':(type===1?'square':'sawtooth');filt.type='lowpass';filt.frequency.setValueAtTime(type===2?1700:1500,now);const start=type===1?700:type===2?540:620,mid=type===1?960:type===2?760:850,end=type===1?620:type===2?470:540;osc.frequency.setValueAtTime(start,now);osc.frequency.exponentialRampToValueAtTime(mid,now+.10);osc.frequency.exponentialRampToValueAtTime(end,now+.45);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(type===1?.14:.18,now+.03);gain.gain.exponentialRampToValueAtTime(.08,now+.18);gain.gain.exponentialRampToValueAtTime(.0001,now+.52);osc.connect(filt).connect(gain).connect(ac.destination);osc.start(now);osc.stop(now+.54)}
const catHit=e=>{const r=renderer.domElement.getBoundingClientRect();pointer.x=((e.clientX-r.left)/r.width)*2-1;pointer.y=-((e.clientY-r.top)/r.height)*2+1;ray.setFromCamera(pointer,camera);return ray.intersectObjects(cat.children,true).length>0};
function reactNow(){const now=performance.now();combo=(now-lastClick<900)?combo+1:1;lastClick=now;react=.8;wake=.95;stretch=Math.min(.7,.35+combo*.1);roll=Math.min(.55,.2+combo*.1);joy=Math.min(1.1,.55+combo*.15);toyJiggle=Math.min(.7,.28+combo*.1);toyPulse=.55;synthMeow(combo%3);bubble.textContent=combo>=4?'Mrrrp! ❤':combo===3?'Meeeeow! ✨':combo===2?'Prrr-meow! 💗':'MEOOOW! ♡';bubble.classList.add('show');hint.classList.add('active');hint.textContent=combo>=3?'😻 So many pets!':'💛 Meow! Pet me again';setTimeout(()=>{bubble.classList.remove('show');hint.classList.remove('active')},850)}
renderer.domElement.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(drag){targetYaw+=(e.clientX-px)*.0035;targetPitch+=(e.clientY-py)*.0025;targetPitch=Math.max(-.28,Math.min(.28,targetPitch));px=e.clientX;py=e.clientY}renderer.domElement.style.cursor=catHit(e)?'pointer':'grab'});renderer.domElement.addEventListener('pointerup',e=>{drag=false;if(catHit(e))reactNow()});renderer.domElement.addEventListener('wheel',e=>{zoom+=e.deltaY*.003;zoom=Math.max(5.2,Math.min(9.6,zoom))},{passive:true});
const projectBubble=()=>{const p=new THREE.Vector3(-.7,2.28,1).project(camera);bubble.style.left=((p.x+1)*.5*innerWidth)+'px';bubble.style.top=((-p.y+1)*.5*innerHeight)+'px'};
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();yaw+=(targetYaw-yaw)*.055;pitch+=(targetPitch-pitch)*.055;camera.position.x=Math.sin(yaw)*zoom;camera.position.z=Math.cos(yaw)*zoom;camera.position.y=2.6+pitch*5;camera.lookAt(0,1.15,.15);const breath=1+Math.sin(t*2.05)*.022,idle=Math.sin(t*1.3)*.015;react*=.94;wake*=.945;stretch*=.97;roll*=.968;joy*=.945;toyJiggle*=.95;toyPulse*=.94;body.scale.set((1.38+stretch*.035)*breath,(.75-stretch*.012)*breath,(.92+stretch*.022)*breath);belly.scale.set((1.26+stretch*.02)*breath,.48*breath,(.76+stretch*.015)*breath);chest.scale.y=.78*breath;cat.position.y=1.34+Math.sin(t*1.7)*.008+react*.01;cat.rotation.z=idle*.7+Math.sin(t*9)*.012*react+Math.sin(t*4.5)*.02*roll;cat.rotation.x=-.016*stretch;head.rotation.z=.10+Math.sin(t*1.25)*.008+react*.035;head.rotation.x=stretch*.02;earL.rotation.z=-.42+Math.sin(t*2.3)*.012+react*.025;earR.rotation.z=.38-Math.sin(t*2.2)*.012-react*.025;tail.rotation.y=Math.sin(t*1.8)*.12+react*.1;tail.rotation.z=.06+Math.sin(t*2.4)*.04+roll*.05;whiskers.forEach((w,i)=>{w.rotation.z=Math.sin(t*1.6+i*.35)*.008+react*.012});const blink=Math.max(0,Math.sin(t*1.35+.7)*1.8-1.3),open=Math.min(1,wake*1.25+blink*.68);eyeLClosed.scale.y=Math.max(.06,1-open*.98);eyeRClosed.scale.y=Math.max(.06,1-open*.98);[eyeLOpen,eyeROpen,irisL,irisR,pupilL,pupilR].forEach(o=>o.scale.y=Math.max(.06,o.userData.baseY||o.scale.y)*(.12+open*.88));eyeLOpen.userData.baseY=.80;eyeROpen.userData.baseY=.80;irisL.userData.baseY=.95;irisR.userData.baseY=.95;pupilL.userData.baseY=1.5;pupilR.userData.baseY=1.5;shineL.scale.setScalar(.18+open*.82);shineR.scale.setScalar(.18+open*.82);shineL.material.opacity=.2+open*.72;shineR.material.opacity=.2+open*.72;zs.forEach((z,i)=>{z.position.y+=.0016*(i+1);z.material.opacity=.35+.4*(.5+.5*Math.sin(t*1.4+i));if(z.position.y>3.9)z.position.y=2.55+i*.28});hearts.forEach((h,i)=>{const v=Math.max(0,joy-i*.12);h.material.opacity=v*.85;h.position.y=2.02+i*.12+(1-v)*.25+Math.sin(t*2.5+i)*.03;h.position.x=-.1+i*.16+Math.sin(t*1.8+i)*.05;h.scale.setScalar(.16+v*.12+i*.015)});yarn.rotation.y+=.003+toyJiggle*.008;ball1.position.y=.24+Math.abs(Math.sin(t*4.2))*.01*toyJiggle;ball2.position.y=.19+Math.abs(Math.sin(t*4.8+1.2))*.009*toyJiggle;ball1.rotation.x+=.015+toyJiggle*.012;ball2.rotation.z+=.012+toyJiggle*.01;mouseToy.rotation.y=.07*Math.sin(t*2.8)*toyJiggle;mouseToy.position.z=1.25+Math.sin(t*3.0)*.02*toyJiggle;fish.rotation.z=-.12+Math.sin(t*3.4)*.03*toyJiggle;yarn.scale.setScalar(1+toyPulse*.025);projectBubble();renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
